name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App & Sync Capacitor
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KirillGames-Debug-APK-v1.1.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release with APK & Changelog
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: 'KirillGames v1.1.${{ github.run_number }}'
          generate_release_notes: true
          body: |
            ### 🎮 KirillGames Android v1.1.8 Сборка #${{ github.run_number }}
            
            - 📲 **APK файл для установки:** скачайте `app-debug.apk` ниже.
            - 🔄 **Обновление поверх старой версии:** подписано постоянным ключом `kirillgames.keystore`, `versionCode` увеличен до `${{ github.run_number }}`.
            - 🎰 **11 Азартных Игр:** 
              - 🎟️ **Кено 40 (Новинка!)** — лотерея с шарами из барабана до x5000
              - 🪙 **Монетка 3D (Новинка!)** — Орёл или Решка с серией удвоений
              - 🚀 **Live Crash Rocket** — мультиплеер онлайн на VPS по WebSockets
              - 🟡 **Плинко (Plinko)** — физика шариков и ячейки с множителями
              - 🎡 **Колесо Фортуны (Рулетка)** — вращающееся колесо до x50
              - 🎲 **Кости Hi-Lo (Dice)** — 3D кости с дублями до x30
              - 🎰 **Candy Slots** — слоты 3x3 с автоспинами
              - 🃏 **Blackjack 21** — классический блэкджек против крупье
              - 👑 **Видео-Покер** — Jacks or Better
              - 🏰 **Башенки (Towers)** — 8 этажей риска
              - 💣 **Мины 5x5 (Mines)** — настраиваемое минное поле
            - 🏆 **Ежедневные Задания и Награды (Квесты):** получай бесплатные монеты за активность!
            - 📳 **Тактильный отклик (Haptic):** вибрация при победах, вращениях и взрывах.
            - 💎 **Liquid Glass UI:** плавающая панель навигации из акрилового стекла.
            - 👑 **Профили и Лидерборд:** 100% бесплатная регистрация, +5 000 стартовых монет, кастомные аватарки и глобальный топ.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
