name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App & Sync Capacitor
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KirillGames-Debug-APK-v1.1.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release with APK & Changelog
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: 'KirillGames v1.1.${{ github.run_number }}'
          generate_release_notes: true
          body: |
            ### 🎮 KirillGames Android v1.1.14 Сборка #${{ github.run_number }}
            
            - 📲 **APK файл для установки:** скачайте `app-debug.apk` ниже.
            - 🔄 **Обновление поверх старой версии:** подписано постоянным ключом `kirillgames.keystore`, `versionCode` увеличен до `${{ github.run_number }}` (14).
            - ⚽ **18-я Игра: Пенальти (Penalty Shootout / Футбольная Дуэль):**
              - Серия пенальти из 5 ударов против умного вратаря!
              - 5 прицельных зон ворот (левая/правая девятка, под перекладину, нижние углы).
              - Лестница множителей: `x1.92` -> `x3.84` -> `x7.68` -> `x15.36` -> `x30.72` (Супер-победа)!
              - Кнопка **CASH OUT (Забрать выигрыш)** после любого забитого гола!
              - Реалистичная анимация бросков вратаря, полет мяча и праздник голов.
            - 🎁 **Стартовый бонус 5 000 🪙:**
              - Всем новым игрокам при бесплатной регистрации на сервере выдается +5 000 монет на баланс!
            - 📢 **Звуки стадиона Web Audio API:**
              - Плотный звук удара по мячу (`playKick`).
              - Судейский свисток арбитра (`playWhistle`).
              - Рёв трибун стадиона при голе (`playCrowdCheer`).
              - Звук сейва перчатками вратаря (`playDeflection`).
            - 🤖 **Telegram-Бот (@kirillgames_bot):**
              - Проверка баланса, топа игроков и мгновенная привязка через аккаунт.
            - 💎 **Правило форматирования монет от 100 Миллионов:**
              - До 100M: полный формат с пробелами (`1 000 000`, `10 000 000`).
              - От 100M: сокращение (`100M`, `4.68B`, `1T`).
            - ⚡ **Оптимизация клиента:**
              - Карточки каталога с аппаратным ускорением и инерционным скроллингом.
            - 🏆 **18 Полноценных Игр в Каталоге:**
              - ⚽ **Пенальти (Новинка!)** — футбольная дуэль до x30.72!
              - 🎡 **Колесо Фортуны** — крути барабан до x50 JACKPOT!
              - 🐉 **Дракон и Тигр** — битва карт до x11!
              - 🪄 **Напёрстки (Thimbles)** — 3D тасовка золотых стаканчиков до x2.88!
              - ⚡ **Лимбо (Limbo)** — космический множитель от x1.01 до x10 000!
              - 🃏 **Карты Hi-Lo** — угадывай следующую карту с динамическими коэффициентами!
              - 👑 **Баккара 9** — VIP казино, ставки на Игрока, Банкира или Ничью до x9!
              - 🎟️ **Кено 40** — лотерея с шарами из барабана до x5000
              - 🪙 **Монетка 3D** — Орёл или Решка с серией удвоений
              - 🚀 **Live Crash Rocket** — мультиплеер онлайн на VPS по WebSockets
              - 🟡 **Плинко (Plinko)** — физика шариков и ячейки с множителями
              - 🎡 **Колесо Удачи** — классическая рулетка
              - 🎲 **Кости Hi-Lo (Dice)** — 3D кости с дублями до x30
              - 🎰 **Candy Slots** — слоты 3x3 с автоспинами
              - 🃏 **Blackjack 21** — классический блэкджек против крупье
              - 👑 **Видео-Покер** — Jacks or Better
              - 🏰 **Башенки (Towers)** — 8 этажей риска
              - 💣 **Мины 5x5 (Mines)** — настраиваемое минное поле
            - 🎵 **Процедурная чилл-музыка:** синтезатор фонового лаунжа на Web Audio API с кнопкой в шапке.
            - 🏆 **Ежедневные Задания и Награды (Квесты):** получай бесплатные монеты за активность!
            - 📺 **Живая лента побед (Live Win Ticker):** победы других игроков в прямом эфире на главной странице.
            - 📳 **Тактильный отклик (Haptic):** вибрация при победах, вращениях и взрывах.
            - 💎 **Liquid Glass UI:** плавающая панель навигации из акрилового стекла.
            - 👑 **Профили и Лидерборд:** 100% бесплатная регистрация, +5 000 стартовых монет, кастомные аватарки и глобальный топ.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
