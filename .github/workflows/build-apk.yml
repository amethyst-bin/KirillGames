name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App & Sync Capacitor
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KirillGames-Debug-APK-v1.1.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release with APK & Changelog
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: 'KirillGames v1.1.${{ github.run_number }}'
          generate_release_notes: true
          body: |
            ### 🎮 KirillGames Android v1.1.25 Сборка #${{ github.run_number }}
            
            - 📲 **APK файл для установки:** скачайте `app-debug.apk` ниже.
            - 🔄 **Обновление поверх старой версии:** подписано постоянным ключом `kirillgames.keystore`, `versionCode` увеличен до `${{ github.run_number }}` (25).
            - 🎲 **27-я Юбилейная Игра: «Vegas Craps VIP: Легендарные Кости»:**
              - Аутентичный стол для крэпса на бархатном сукне с полным набором ставок!
              - **Pass Line & Don't Pass** с фазами Come-Out и Point (ON/OFF).
              - Ставка **Field (Поле)** с повышенными выплатами на 2 и 12 (до 3:1).
              - Сектора **Any 7 (4:1)**, **Any Craps (7:1)** и **Hardways дубли (до 9:1)**!
              - 3D анимированные рубиновые кости с реалистичной физикой вращения и озвучкой броска на зеленом сукне.
            - 🏷️ **Категории и Фильтры в Каталоге (27 Игр):**
              - Быстрые фильтры: «Все (27)», «Слоты», «Карты», «Аркады», «Кости & Столы», «Лотереи» с плавной анимацией.
            - 🚀 **Полный Редизайн Crash Rocket (Краш-Ракета):**
              - Плавная диагональная траектория взлета в правый верхний сектор!
              - Неоновый светящийся график траектории полета с градиентной подсветкой.
              - Динамический наклон корпуса ракеты по касательному углу полета с реактивным пламенем.
              - Взрывное визуальное падение при взрыве (CRASHED) с индикатором точки взрыва.
              - Исправление бага аватаров в ставках: круглые миниатюры вместо строк base64.
              - Исправление бага салюта: победный конфетти срабатывает строго 1 раз.
            - 👤 **Полноэкранный Профиль Игрока в Лидерборде (Full-Screen Profile):**
              - Полноэкранный режим с плавной прокруткой и шапкой «Назад».
              - Детальная статистика: Количество побед, Винрейт %, Всего поставлено, Всего выиграно, Чистый профит.
              - Интерактивный неоновый SVG график динамики доходности по последним 20 раундам.
            - 🔄 **Встроенная Система Автообновления (In-App Updater):**
              - Проверка свежих релизов с GitHub Releases при запуске игры.
              - Кнопка «Обновить» в профиле с индикатором версии.
              - Окно обновления с прямым скачиванием APK и решением конфликта пакетов на Android.
            - 🔐 **26-я Игра: «Взлом Сейфа: Мастер Кода» (Vault Cracker):**
              - 3 уровня сложности: Офисный (x8), Банковский (x25), Швейцарский VIP (x100).
              - Интерактивный кодовый замок с подсказками «Больше/Меньше/Попадание» и звуками тумблеров.
            - 🔊 **Новые процедурные звуковые эффекты (Web Audio API):**
              - Звук встряхивания костей в кожаном стакане (`playDiceShake`).
              - Перекатывание и глухой стук костей о сукно стола (`playDiceTumble`).
              - Казино-фанфара победы в крэпсе (`playCrapsWin`).
              - Карманные карты, Флоп, Тёрн, Ривер против Дилера и Роял Флеш x100!
            - 🥊 **23-я Игра: «RPS Арена» (Rock Paper Scissors):**
              - Дуэль жестов со стриками до x112!
            - ⚓ **22-я Игра: «Морской Куш» (Battleship Strike):**
              - Охота за флотом на радарной сетке 5x5 с линкорами до x40!
            - 🍬 **21-я Игра: «Сладкий Куш» (Sweet Rush):**
              - 5x5 каскадный слот со взрывными бомбами до x100!
            - 🎲 **20-я Игра: «Сик Бо» (Sic Bo — Тройные Кости Макао):**
              - Стеклянный купол, 3 кости, Тройка 6-6-6 до x181!
            - 🤖 **Telegram-Бот (@kirillgames_bot):**
              - Баланс, топ и привязка аккаунта.
            - 🏆 **25 Полноценных Игр в Каталоге:**
              - 📖 **Золото Фараона (Новинка!)** — Книга Ра 5x3 с фриспинами и спец-символом!
              - 🃏 **Казино Холдем** — Техасский покер с Роял Флешем до x100!
              - 🥊 **RPS Арена** — дуэль жестов со стриком до x112!
              - ⚓ **Морской Куш** — морской бой с торпедами и линкорами до x40!
              - 🍬 **Сладкий Куш** — каскадный кластерный слот с бомбами до x100!
              - 🎲 **Сик Бо** — купол с костями до x181!
              - 🎫 **Скретч-Лотерея** — сотри фольгу до x500!
              - ⚽ **Пенальти** — футбольная дуэль до x30.72!
              - 🎡 **Колесо Фортуны** — до x50 JACKPOT!
              - 🐉 **Дракон и Тигр** — битва карт до x11!
              - 🪄 **Напёрстки (Thimbles)** — 3D тасовка золотых стаканчиков до x2.88!
              - ⚡ **Лимбо (Limbo)** — космический множитель от x1.01 до x10 000!
              - 🃏 **Карты Hi-Lo** — угадывай следующую карту с динамическими коэффициентами!
              - 👑 **Баккара 9** — VIP казино, ставки на Игрока, Банкира или Ничью до x9!
              - 🎟️ **Кено 40** — лотерея с шарами из барабана до x5000
              - 🪙 **Монетка 3D** — Орёл или Решка с серией удвоений
              - 🚀 **Live Crash Rocket** — мультиплеер онлайн на VPS по WebSockets
              - 🟡 **Плинко (Plinko)** — физика шариков и ячейки с множителями
              - 🎡 **Колесо Удачи** — классическая рулетка
              - 🎲 **Кости Hi-Lo (Dice)** — 3D кости с дублями до x30
              - 🎰 **Candy Slots** — слоты 3x3 с автоспинами
              - 🃏 **Blackjack 21** — классический блэкджек против крупье
              - 👑 **Видео-Покер** — Jacks or Better
              - 🏰 **Башенки (Towers)** — 8 этажей риска
              - 💣 **Мины 5x5 (Mines)** — настраиваемое минное поле
            - 🎵 **Процедурная чилл-музыка:** синтезатор фонового лаунжа на Web Audio API с кнопкой в шапке.
            - 🏆 **Ежедневные Задания и Награды (Квесты):** получай бесплатные монеты за активность!
            - 📺 **Живая лента побед (Live Win Ticker):** победы других игроков в прямом эфире на главной странице.
            - 📳 **Тактильный отклик (Haptic):** вибрация при победах, вращениях и взрывах.
            - 💎 **Liquid Glass UI:** плавающая панель навигации из акрилового стекла.
            - 👑 **Профили и Лидерборд:** 100% бесплатная регистрация, +5 000 стартовых монет, кастомные аватарки и глобальный топ.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
