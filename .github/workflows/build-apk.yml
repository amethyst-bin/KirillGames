name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App & Sync Capacitor
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KirillGames-Debug-APK-v1.1.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release with APK & Changelog
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: 'KirillGames v1.1.${{ github.run_number }}'
          generate_release_notes: true
          body: |
            ### 🎮 KirillGames Android v1.1 Сборка #${{ github.run_number }}
            
            - 📲 **APK файл для установки:** скачайте `app-debug.apk` ниже.
            - 🔄 **Обновление поверх старой версии:** `versionCode` увеличен до `${{ github.run_number }}`, поэтому Android разрешает установку поверх без удаления.
            - 🎰 **9 Азартных Игр:** Candy Slots, Live Crash Rocket (онлайн мультиплеер на VPS по WebSockets), Плинко (Plinko), Колесо Фортуны (Рулетка), Кости Hi-Lo (Dice), Blackjack 21, Покер Jacks or Better, Башенки (Towers), Мины 5x5 (Mines).
            - 💎 **Liquid Glass UI:** плавающий полупрозрачный док навигации с эффектом акрилового стекла.
            - 👑 **Профили и Лидерборд:** регистрация по логину/паролю, загрузка любых картинок в профиль, инспектор чужих профилей, отслеживание времени в игре и рекордов выигрышей!
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
