name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App & Sync Capacitor
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KirillGames-Debug-APK-v1.1.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release with APK & Changelog
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: 'KirillGames v1.1.${{ github.run_number }}'
          generate_release_notes: true
          body: |
            ### 🎮 KirillGames Android v1.1.13 Сборка #${{ github.run_number }}
            
            - 📲 **APK файл для установки:** скачайте `app-debug.apk` ниже.
            - 🔄 **Обновление поверх старой версии:** подписано постоянным ключом `kirillgames.keystore`, `versionCode` увеличен до `${{ github.run_number }}`.
            - 🎡 **17-я Игра: Колесо Фортуны (Wheel of Fortune / Dream Catcher):**
              - Яркое вращающееся колесо удачи с 24 секторами!
              - Множители: `x1`, `x2`, `x5`, `x10`, `x20` и легендарный `x50 JACKPOT`!
              - Физика замедления, динамический указатель и звук трещотки при вращении.
            - 💎 **Правило форматирования монет со 100 Миллионов:**
              - До 100M: полный формат с пробелами (например `1 000 000`, `10 000 000`, `99 999 999`).
              - От 100M: умное сокращение (`100M`, `4.68B`, `1T`).
              - Никаких вылетов за экран в топах, шапке и профиле!
            - 🤖 **Telegram Бот (@kirillgames_bot):**
              - Проверка текущего баланса, уровня и топа игроков через бота!
              - Привязка аккаунта в Профиле по одноразовому 6-значному коду или кнопке.
              - Бот работает 24/7 на VPS сервере.
            - ⚡ **Оптимизация клиента (Устранены все лаги):**
              - Удалено 48 одновременных GPU blur-фильтров с карточек каталога.
              - Включено аппаратное ускорение `android:hardwareAccelerated="true"`.
              - Добавлен нативный плавный скроллинг `smooth-scroll`.
              - Устранена нагрузка на графический процессор Android WebView.
            - 🎵 **Новые синтезированные звуки Web Audio:**
              - Звук щелчков трещотки колеса фортуны (`playWheelTick`).
              - Хлёсткий звук раздачи игральных карт (`playCardFlip`).
              - Перестук костей о сукно (`playDiceRoll`).
            - 🐉 **17 Азартных Игр:** 
              - 🎡 **Колесо Фортуны (Новинка!)** — вращай барабан до x50 JACKPOT!
              - 🐉 **Дракон и Тигр** — битва карт до x11!
              - 🪄 **Напёрстки (Thimbles)** — 3D тасовка золотых стаканчиков до x2.88!
              - ⚡ **Лимбо (Limbo)** — космический множитель от x1.01 до x10 000!
              - 🃏 **Карты Hi-Lo** — угадывай следующую карту с динамическими коэффициентами!
              - 👑 **Баккара 9** — VIP казино, ставки на Игрока, Банкира или Ничью до x9!
              - 🎟️ **Кено 40** — лотерея с шарами из барабана до x5000
              - 🪙 **Монетка 3D** — Орёл или Решка с серией удвоений
              - 🚀 **Live Crash Rocket** — мультиплеер онлайн на VPS по WebSockets
              - 🟡 **Плинко (Plinko)** — физика шариков и ячейки с множителями
              - 🎡 **Колесо Удачи** — классическая рулетка
              - 🎲 **Кости Hi-Lo (Dice)** — 3D кости с дублями до x30
              - 🎰 **Candy Slots** — слоты 3x3 с автоспинами
              - 🃏 **Blackjack 21** — классический блэкджек против крупье
              - 👑 **Видео-Покер** — Jacks or Better
              - 🏰 **Башенки (Towers)** — 8 этажей риска
              - 💣 **Мины 5x5 (Mines)** — настраиваемое минное поле
            - 🎵 **Процедурная чилл-музыка:** синтезатор фонового лаунжа на Web Audio API с кнопкой в шапке.
            - 🏆 **Ежедневные Задания и Награды (Квесты):** получай бесплатные монеты за активность!
            - 📺 **Живая лента побед (Live Win Ticker):** победы других игроков в прямом эфире на главной странице.
            - 📳 **Тактильный отклик (Haptic):** вибрация при победах, вращениях и взрывах.
            - 💎 **Liquid Glass UI:** плавающая панель навигации из акрилового стекла.
            - 👑 **Профили и Лидерборд:** 100% бесплатная регистрация, +5 000 стартовых монет, кастомные аватарки и глобальный топ.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
